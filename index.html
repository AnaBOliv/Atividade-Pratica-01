<html>
<body>

    <div class="assinatura">
        Desenvolvido por Ana B.
    </div>

    <button id="temaBtn" aria-label="Alternar tema">
        🌙
    </button>

    <main class="pagina">

        <div class="container">

            <h1>Cadastro de Produtos</h1>

            <form id="produtoForm">

                <div class="campo">
                    <label for="nome">Nome do Produto</label>
                    <input
                        type="text"
                        id="nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="preco">Preço</label>
                    <input
                        type="number"
                        id="preco"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn-adicionar"
                >
                    Adicionar Produto
                </button>

            </form>

            <h2>Lista de Produtos</h2>

            <ul id="listaProdutos"></ul>

        </div>

    </main>

    <footer>
        Criado para fins de prática •
        anaboliveira2319@gmail.com
    </footer>

    <script src="script.js" defer></script>

</body>
</html>
